<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Banana Clicker</title>

<link
    rel="icon"
    type="image/png"
    href="assets/banana.png"
>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    width:100%;
    height:100%;

}


body{

    overflow:hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:white;

    background:#050b12;

}


/* =========================================================
   FONDO
========================================================= */

#backgroundCanvas{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:0;

    pointer-events:none;

}


#overlay{

    position:fixed;

    inset:0;

    z-index:1;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,220,60,.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 10% 20%,
            rgba(0,180,255,.08),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 80%,
            rgba(130,70,255,.08),
            transparent 30%
        );

}


#vignette{

    position:fixed;

    inset:0;

    z-index:2;

    pointer-events:none;

    box-shadow:
        inset 0 0 180px
        rgba(0,0,0,.65);

}


/* =========================================================
   JUEGO
========================================================= */

#game{

    position:relative;

    z-index:10;

    height:100vh;

    width:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:20px;

    user-select:none;

}


/* =========================================================
   TITULO
========================================================= */

#title{

    margin:0 0 8px;

    font-size:
        clamp(
            2.3rem,
            7vw,
            4.5rem
        );

    font-weight:900;

    letter-spacing:-2px;

    text-shadow:

        0 3px 12px
        rgba(0,0,0,.45),

        0 0 25px
        rgba(255,220,50,.25);

    animation:
        titleFloat
        3s
        ease-in-out
        infinite;

}


@keyframes titleFloat{

    0%,
    100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-4px);
    }

}


/* =========================================================
   TUS CLICKS
========================================================= */

#counter{

    margin:0;

    font-size:1.35rem;

    font-weight:800;

    transition:
        transform .12s,
        color .12s;

}


#counter.pop{

    transform:scale(1.16);

    color:#ffe55b;

}


/* =========================================================
   GLOBAL
========================================================= */

#globalCounter{

    margin:5px 0 0;

    font-size:1rem;

    font-weight:700;

    color:
        rgba(255,255,255,.75);

}


#globalCounter span{

    color:#ffe45a;

    text-shadow:
        0 0 12px
        rgba(255,220,60,.35);

}


#globalStatus{

    margin-top:3px;

    font-size:.7rem;

    color:
        rgba(255,255,255,.35);

}


/* =========================================================
   NIVEL
========================================================= */

#level{

    margin:
        8px
        0
        10px;

    color:
        rgba(255,255,255,.7);

    font-size:.9rem;

}


/* =========================================================
   ÁREA BANANA
========================================================= */

#bananaArea{

    position:relative;

    width:
        min(
            520px,
            92vw
        );

    height:
        min(
            55vh,
            450px
        );

    display:flex;

    align-items:center;

    justify-content:center;

    perspective:1000px;

}


/* =========================================================
   LUZ
========================================================= */

#bananaLight{

    position:absolute;

    width:270px;
    height:270px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,220,60,.28),
            rgba(255,220,60,.05) 48%,
            transparent 70%
        );

    filter:blur(12px);

    animation:
        bananaLight
        2.4s
        ease-in-out
        infinite;

}


@keyframes bananaLight{

    0%,
    100%{
        transform:scale(.88);
        opacity:.6;
    }

    50%{
        transform:scale(1.14);
        opacity:1;
    }

}


/* =========================================================
   BANANA
========================================================= */

#banana{

    position:relative;

    z-index:5;

    width:
        min(
            280px,
            65vw
        );

    max-height:45vh;

    object-fit:contain;

    cursor:pointer;

    user-select:none;

    -webkit-user-drag:none;

    transform:
        translate3d(
            var(--mx,0px),
            var(--my,0px),
            0
        );

    filter:
        drop-shadow(
            0 20px 20px
            rgba(0,0,0,.3)
        );

    animation:
        bananaFloat
        3s
        ease-in-out
        infinite;

}


@keyframes bananaFloat{

    0%,
    100%{

        margin-top:0;

    }

    50%{

        margin-top:-14px;

    }

}


/* =========================================================
   CLICK ANIMATION
========================================================= */

#banana.clicked{

    animation:none;

    transform:

        translate3d(
            var(--mx,0px),
            var(--my,0px),
            0
        )

        scale(.88)

        rotate(-6deg);

    filter:

        brightness(1.15)

        drop-shadow(
            0 0 30px
            rgba(255,220,60,.6)
        );

}


/* =========================================================
   EVOLUCIÓN
========================================================= */

#banana.evolving{

    animation:
        evolve
        .8s
        ease-in-out;

}


@keyframes evolve{

    0%{

        transform:scale(1);

        filter:brightness(1);

    }

    25%{

        transform:
            scale(1.25)
            rotate(-6deg);

        filter:

            brightness(1.8)

            drop-shadow(
                0 0 40px
                rgba(255,220,50,.9)
            );

    }

    50%{

        transform:
            scale(.9)
            rotate(6deg);

    }

    75%{

        transform:
            scale(1.12)
            rotate(-3deg);

    }

    100%{

        transform:scale(1);

        filter:brightness(1);

    }

}


/* =========================================================
   NUMEROS
========================================================= */

.floatingNumber{

    position:fixed;

    z-index:100;

    pointer-events:none;

    font-size:1.4rem;

    font-weight:900;

    color:white;

    text-shadow:
        0 3px 10px
        rgba(0,0,0,.7);

    animation:
        numberFloat
        .85s
        ease-out
        forwards;

}


.floatingNumber.plus5{

    color:#ffe35a;

    font-size:1.75rem;

}


@keyframes numberFloat{

    0%{

        opacity:0;

        transform:
            translateY(0)
            scale(.5);

    }

    15%{

        opacity:1;

        transform:
            translateY(-10px)
            scale(1.1);

    }

    100%{

        opacity:0;

        transform:
            translate(
                var(--randomX),
                -95px
            )
            scale(1);

    }

}


/* =========================================================
   PARTICULAS
========================================================= */

.clickParticle{

    position:fixed;

    width:8px;
    height:8px;

    border-radius:50%;

    z-index:90;

    pointer-events:none;

    background:#ffe45c;

    box-shadow:
        0 0 12px
        rgba(255,220,60,.9);

    animation:
        explodeParticle
        .7s
        ease-out
        forwards;

}


@keyframes explodeParticle{

    from{

        opacity:1;

        transform:
            translate(0,0)
            scale(1);

    }

    to{

        opacity:0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);

    }

}


/* =========================================================
   FLASH
========================================================= */

#flash{

    position:fixed;

    inset:0;

    z-index:80;

    pointer-events:none;

    opacity:0;

    background:

        radial-gradient(
            circle at center,
            rgba(255,230,70,.45),
            transparent 60%
        );

}


#flash.active{

    animation:
        flash
        .8s
        ease-out;

}


@keyframes flash{

    0%{
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}


/* =========================================================
   BOSS
========================================================= */

body.boss{

    animation:
        bossShake
        .1s
        infinite
        alternate;

}


body.boss #bananaLight{

    background:

        radial-gradient(
            circle,
            rgba(255,35,35,.45),
            transparent 70%
        );

}


@keyframes bossShake{

    from{
        transform:translateX(-2px);
    }

    to{
        transform:translateX(2px);
    }

}


/* =========================================================
   MOVIL
========================================================= */

@media(max-width:600px){

    #game{

        padding:15px;

    }


    #title{

        font-size:
            clamp(
                2rem,
                12vw,
                3rem
            );

    }


    #counter{

        font-size:1.15rem;

    }


    #globalCounter{

        font-size:.9rem;

    }


    #bananaArea{

        width:95vw;

        height:52vh;

    }


    #banana{

        width:
            min(
                75vw,
                275px
            );

        max-height:42vh;

    }


    #bananaLight{

        width:210px;
        height:210px;

    }

}

</style>

</head>


<body>


<canvas id="backgroundCanvas"></canvas>

<div id="overlay"></div>

<div id="vignette"></div>

<div id="flash"></div>


<main id="game">


    <h1 id="title">
        Banana Clicker
    </h1>


    <p id="counter">
        Clicks: 0
    </p>


    <p id="globalCounter">
        🌎 Global clicks:
        <span id="globalClicks">
            0
        </span>
    </p>


    <div id="globalStatus">
        conectando...
    </div>


    <p id="level">
        Nivel: Banana normal
    </p>


    <div id="bananaArea">

        <div id="bananaLight"></div>

        <img
            id="banana"
            src="assets/banana.png"
            draggable="false"
            alt="Banana"
        >

    </div>


</main>


<!-- =====================================================
     SONIDOS
===================================================== -->

<audio
    id="clickSound"
    src="assets/click.mp3"
    preload="auto"
></audio>


<audio
    id="evolveSound"
    src="assets/evolve.mp3"
    preload="auto"
></audio>


<audio
    id="plusSound"
    src="assets/event_plus5.mp3"
    preload="auto"
></audio>


<audio
    id="bossSound"
    src="assets/boss.mp3"
    preload="auto"
></audio>


<audio
    id="secretSound"
    src="assets/secret.mp3"
    preload="auto"
></audio>


<audio
    id="explodeSound"
    src="assets/explode.mp3"
    preload="auto"
></audio>


<script>

/* =========================================================
   TUS CLICKS
   NO SE CAMBIA
========================================================= */

let clicks =
    Number(
        localStorage.getItem("clicks")
    ) || 0;


let levelIndex =
    Number(
        localStorage.getItem("level")
    ) || 0;


/* =========================================================
   ELEMENTOS
========================================================= */

const banana =
    document.getElementById("banana");

const counter =
    document.getElementById("counter");

const levelText =
    document.getElementById("level");

const globalClicks =
    document.getElementById(
        "globalClicks"
    );

const globalStatus =
    document.getElementById(
        "globalStatus"
    );

const flash =
    document.getElementById(
        "flash"
    );


/* =========================================================
   SONIDOS
========================================================= */

const clickSound =
    document.getElementById(
        "clickSound"
    );

const evolveSound =
    document.getElementById(
        "evolveSound"
    );

const plusSound =
    document.getElementById(
        "plusSound"
    );

const bossSound =
    document.getElementById(
        "bossSound"
    );

const secretSound =
    document.getElementById(
        "secretSound"
    );


/* =========================================================
   NIVELES ORIGINALES
========================================================= */

const levels = [

    {
        name:"Banana normal",
        need:0,
        img:"banana.png"
    },

    {
        name:"banana evil",
        need:500,
        img:"banana_evil.png"
    },

    {
        name:"banana slimin",
        need:1000,
        img:"slimin.png"
    },

    {
        name:"bananini",
        need:1500,
        img:"bananini.png"
    },

    {
        name:"vendedor de banana",
        need:2000,
        img:"vendedor.png"
    },

    {
        name:"EL banana",
        need:3000,
        img:"sombbrero.png"
    },

    {
        name:"Banana addiel",
        need:4000,
        img:"addiel.png"
    },

    {
        name:"Bananini Slimininini",
        need:5000,
        img:"sliminini.png"
    },

    {
        name:"Banananza",
        need:6000,
        img:"banananza.png"
    },

    {
        name:"Bananeado",
        need:7000,
        img:"jh.png"
    },

    {
        name:"Baneen a Ana",
        need:8500,
        img:"ana.png"
    },

    {
        name:"Bananini Evilini",
        need:10000,
        img:"evil_big.png"
    },

    {
        name:"BA-NA-NA",
        need:15000,
        img:"glitch.png"
    },

    {
        name:"Banana Chat GPT",
        need:25000,
        img:"robot.png"
    },

    {
        name:"Triptofano",
        need:40000,
        img:"triptofano.png"
    },

    {
        name:"SkeleNana",
        need:60000,
        img:"skele.png"
    },

    {
        name:"Bantasma",
        need:78000,
        img:"bantasma.png"
    },

    {
        name:"Platano",
        need:100000,
        img:"platano.png"
    },

    {
        name:"Final boss banana",
        need:150000,
        img:"boss.png",
        boss:true
    }

];


/* =========================================================
   RUTA
========================================================= */

function imagePath(file){

    return "assets/" + file;

}


/* =========================================================
   ACTUALIZAR UI
========================================================= */

function updateUI(){

    counter.textContent =
        "Clicks: " + clicks;

    levelText.textContent =
        "Nivel: " +
        levels[levelIndex].name;

    banana.src =
        imagePath(
            levels[levelIndex].img
        );

}


/* =========================================================
   GLOBAL CLICKS
========================================================= */

async function loadGlobalClicks(){

    try{

        const response =
            await fetch(
                "/.netlify/functions/clicks",
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Global counter error"
            );

        }


        const data =
            await response.json();


        globalClicks.textContent =
            Number(
                data.globalClicks
            ).toLocaleString(
                "es-CO"
            );


        globalStatus.textContent =
            "● conectado";


    }catch(error){

        console.error(error);


        globalStatus.textContent =
            "● sin conexión";


    }

}


/* =========================================================
   SUMAR CLICK GLOBAL
========================================================= */

async function addGlobalClick(){

    try{

        const response =
            await fetch(
                "/.netlify/functions/clicks",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            amount:1
                        })
                }
            );


        if(!response.ok){

            throw new Error(
                "Could not add click"
            );

        }


        const data =
            await response.json();


        globalClicks.textContent =
            Number(
                data.globalClicks
            ).toLocaleString(
                "es-CO"
            );


        globalStatus.textContent =
            "● conectado";


    }catch(error){

        console.error(error);


        /*
         * El click local NO se pierde.
         * Si falla internet, el jugador sigue
         * teniendo su click normalmente.
         */

        globalStatus.textContent =
            "● global temporalmente desconectado";

    }

}


/* =========================================================
   PARTICULAS
========================================================= */

function createClickParticles(){

    const rect =
        banana.getBoundingClientRect();


    const x =
        rect.left +
        rect.width / 2;


    const y =
        rect.top +
        rect.height / 2;


    for(
        let i = 0;
        i < 14;
        i++
    ){

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "clickParticle";


        particle.style.left =
            x + "px";


        particle.style.top =
            y + "px";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            45 +
            Math.random() * 90;


        particle.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );


        particle.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        document.body.appendChild(
            particle
        );


        setTimeout(
            () => particle.remove(),
            750
        );

    }

}


/* =========================================================
   +1 / +5
========================================================= */

function floatingNumber(amount){

    const rect =
        banana.getBoundingClientRect();


    const number =
        document.createElement(
            "div"
        );


    number.className =
        "floatingNumber";


    if(amount === 5){

        number.classList.add(
            "plus5"
        );

    }


    number.textContent =
        "+" + amount;


    number.style.left =
        (
            rect.left +
            rect.width / 2
        ) + "px";


    number.style.top =
        (
            rect.top +
            rect.height / 2
        ) + "px";


    number.style.setProperty(
        "--randomX",
        (
            Math.random() *
            70 -
            35
        ) + "px"
    );


    document.body.appendChild(
        number
    );


    setTimeout(
        () => number.remove(),
        900
    );

}


/* =========================================================
   EVOLUCIÓN
========================================================= */

function evolutionEffect(){

    banana.classList.remove(
        "evolving"
    );

    void banana.offsetWidth;

    banana.classList.add(
        "evolving"
    );


    flash.classList.remove(
        "active"
    );

    void flash.offsetWidth;

    flash.classList.add(
        "active"
    );

}


/* =========================================================
   BOSS
========================================================= */

function bossEffect(){

    document.body.classList.add(
        "boss"
    );


    setTimeout(
        () => {

            document.body.classList.remove(
                "boss"
            );

        },
        2500
    );

}


/* =========================================================
   NIVEL
========================================================= */

function checkLevelUp(){

    if(

        levelIndex + 1 <
        levels.length &&

        clicks >=
        levels[
            levelIndex + 1
        ].need

    ){

        levelIndex++;


        evolveSound.currentTime = 0;

        evolveSound
            .play()
            .catch(
                () => {}
            );


        evolutionEffect();


        if(
            levels[levelIndex].boss
        ){

            bossSound.currentTime = 0;

            bossSound
                .play()
                .catch(
                    () => {}
                );


            bossEffect();

        }


        localStorage.setItem(
            "level",
            levelIndex
        );


        updateUI();

    }

}


/* =========================================================
   SECRETO ORIGINAL
========================================================= */

function checkSecret(){

    const today =
        new Date();


    if(

        today.getDate() === 12 &&

        today.getMonth() === 0 &&

        levelIndex > 16

    ){

        banana.src =
            imagePath(
                "pastel.png"
            );


        secretSound.currentTime = 0;

        secretSound
            .play()
            .catch(
                () => {}
            );

    }

}


/* =========================================================
   CLICK DE BANANA
========================================================= */

banana.addEventListener(
    "click",
    function(){

        /* ---------------------------------------------
           TU CLICK ORIGINAL
        --------------------------------------------- */

        clicks++;


        /* ---------------------------------------------
           GUARDAR TU CLICK
        --------------------------------------------- */

        localStorage.setItem(
            "clicks",
            clicks
        );


        /* ---------------------------------------------
           SONIDO
        --------------------------------------------- */

        clickSound.currentTime = 0;

        clickSound
            .play()
            .catch(
                () => {}
            );


        /* ---------------------------------------------
           ANIMACIÓN
        --------------------------------------------- */

        banana.classList.remove(
            "clicked"
        );

        void banana.offsetWidth;

        banana.classList.add(
            "clicked"
        );


        setTimeout(
            () => {

                banana.classList.remove(
                    "clicked"
                );

            },
            120
        );


        /* ---------------------------------------------
           PARTICULAS
        --------------------------------------------- */

        createClickParticles();


        /* ---------------------------------------------
           +1
        --------------------------------------------- */

        floatingNumber(1);


        /* ---------------------------------------------
           CONTADOR POP
        --------------------------------------------- */

        counter.classList.remove(
            "pop"
        );

        void counter.offsetWidth;

        counter.classList.add(
            "pop"
        );


        /* ---------------------------------------------
           GLOBAL
           1 CLICK REAL = +1 GLOBAL
        --------------------------------------------- */

        addGlobalClick();


        /* ---------------------------------------------
           +5 CADA 50 CLICKS
           EXACTAMENTE TU MECÁNICA
        --------------------------------------------- */

        if(
            clicks % 50 === 0
        ){

            clicks += 5;


            plusSound.currentTime = 0;

            plusSound
                .play()
                .catch(
                    () => {}
                );


            floatingNumber(5);


            /*
             * IMPORTANTE:
             * El +5 NO cuenta como 5 clicks globales.
             * Sigue siendo un solo click realizado.
             */

        }


        /* ---------------------------------------------
           GUARDAR DE NUEVO
        --------------------------------------------- */

        localStorage.setItem(
            "clicks",
            clicks
        );


        /* ---------------------------------------------
           SISTEMAS
        --------------------------------------------- */

        checkLevelUp();

        checkSecret();

        updateUI();

    }
);


/* =========================================================
   MOVIMIENTO CON MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    function(event){

        const x =
            event.clientX /
            window.innerWidth -
            .5;


        const y =
            event.clientY /
            window.innerHeight -
            .5;


        banana.style.setProperty(
            "--mx",
            x * 18 + "px"
        );


        banana.style.setProperty(
            "--my",
            y * 18 + "px"
        );

    }
);


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById(
        "backgroundCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


let width =
    window.innerWidth;


let height =
    window.innerHeight;


let mouseX =
    width / 2;


let mouseY =
    height / 2;


let particles = [];


let time = 0;


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        width * ratio;


    canvas.height =
        height * ratio;


    canvas.style.width =
        width + "px";


    canvas.style.height =
        height + "px";


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    createBackgroundParticles();

}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   PARTICULAS DE FONDO
========================================================= */

function createBackgroundParticles(){

    particles = [];


    const amount =
        width < 600
        ? 45
        : 90;


    for(
        let i = 0;
        i < amount;
        i++
    ){

        particles.push({

            x:
                Math.random() *
                width,

            y:
                Math.random() *
                height,

            r:
                .6 +
                Math.random() * 2,

            speed:
                .15 +
                Math.random() * .4,

            drift:
                (
                    Math.random() -
                    .5
                ) * .35,

            phase:
                Math.random() *
                Math.PI *
                2,

            alpha:
                .15 +
                Math.random() * .45

        });

    }

}


/* =========================================================
   MOUSE
========================================================= */

window.addEventListener(
    "mousemove",
    function(event){

        mouseX =
            event.clientX;

        mouseY =
            event.clientY;

    }
);


/* =========================================================
   FONDO ANIMADO
========================================================= */

function draw(){

    time += .008;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* ---------------------------------------------
       BASE
    --------------------------------------------- */

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            width,
            height
        );


    gradient.addColorStop(
        0,
        "#06131f"
    );


    gradient.addColorStop(
        .5,
        "#082d3b"
    );


    gradient.addColorStop(
        1,
        "#11152f"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* ---------------------------------------------
       LUZ DEL MOUSE
    --------------------------------------------- */

    const mouseLight =
        ctx.createRadialGradient(
            mouseX,
            mouseY,
            0,
            mouseX,
            mouseY,
            340
        );


    mouseLight.addColorStop(
        0,
        "rgba(255,220,60,.07)"
    );


    mouseLight.addColorStop(
        1,
        "rgba(255,220,60,0)"
    );


    ctx.fillStyle =
        mouseLight;


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* ---------------------------------------------
       ONDAS
    --------------------------------------------- */

    for(
        let wave = 0;
        wave < 3;
        wave++
    ){

        ctx.beginPath();


        const baseY =
            height *
            (
                .30 +
                wave * .27
            );


        for(
            let x = 0;
            x <= width;
            x += 10
        ){

            const y =
                baseY +

                Math.sin(
                    x * .008 +
                    time *
                    (
                        1 +
                        wave * .2
                    )
                ) * 25 +

                Math.sin(
                    x * .003 -
                    time * 1.4
                ) * 15;


            if(x === 0){

                ctx.moveTo(
                    x,
                    y
                );

            }else{

                ctx.lineTo(
                    x,
                    y
                );

            }

        }


        ctx.lineTo(
            width,
            height
        );

        ctx.lineTo(
            0,
            height
        );

        ctx.closePath();


        ctx.fillStyle =
            wave === 0
            ? "rgba(0,190,220,.018)"
            : "rgba(100,80,230,.014)";


        ctx.fill();

    }


    /* ---------------------------------------------
       PARTICULAS
    --------------------------------------------- */

    particles.forEach(
        p => {

            p.y -= p.speed;


            p.x +=
                p.drift +
                Math.sin(
                    time +
                    p.phase
                ) * .08;


            if(
                p.y < -10
            ){

                p.y =
                    height + 10;

            }


            if(
                p.x < -10
            ){

                p.x =
                    width + 10;

            }


            if(
                p.x > width + 10
            ){

                p.x =
                    -10;

            }


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                p.r,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                `rgba(
                    255,
                    230,
                    100,
                    ${p.alpha}
                )`;


            ctx.fill();

        }
    );


    requestAnimationFrame(
        draw
    );

}


resize();

draw();


/* =========================================================
   PRELOAD DE IMÁGENES
========================================================= */

levels.forEach(
    level => {

        const img =
            new Image();

        img.src =
            imagePath(
                level.img
            );

    }
);


/* =========================================================
   INICIALIZAR
========================================================= */

updateUI();

loadGlobalClicks();

</script>

</body>

</html>
